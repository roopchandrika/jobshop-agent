    reads: [{tool: get_order, args: {order_id: O-104}}]
    obeys:
      - {tool: create_draft}
      - {tool: simulate_downtime, args: {draft_id: D1, machine_id: M1, start: "2026-01-05 10:00", end: "2026-01-05 22:00"}}
      - {tool: simulate_downtime, args: {draft_id: D1, machine_id: M2, start: "2026-01-05 10:00", end: "2026-01-05 22:00"}}
      - {tool: simulate_downtime, args: {draft_id: D1, machine_id: M3, start: "2026-01-05 10:00", end: "2026-01-05 22:00"}}
      - {tool: simulate_downtime, args: {draft_id: D1, machine_id: M4, start: "2026-01-05 10:00", end: "2026-01-05 22:00"}}
      - {tool: reschedule, args: {draft_id: D1}}
