[project]
name = "jobshop-agent"
version = "0.1.0"
description = "LLM agent that helps planners handle job-shop disruptions by calling a CP-SAT scheduler as tools (portfolio project, synthetic data only)"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "anthropic>=1.12.0",
    "fastapi>=0.142.4",
    "mcp>=2.3.0",
    "ortools>=9.15.6755",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
# Semantic search over the plant documents (Phase 8b). Optional: the keyword search needs none of it, and
# CI and the tests run without it. Install with:  uv sync --extra embeddings
embeddings = [
    "fastembed>=0.9.0",
    "numpy>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "jobshop"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets tests do `from tests.helpers import ...`.
pythonpath = ["."]
markers = ["slow: solves a full-size instance (a few seconds)"]
