[project]
name = "jobshop-agent"
version = "0.1.0"
description = "LLM agent that helps planners handle job-shop disruptions by calling a CP-SAT scheduler as tools (portfolio project, synthetic data only)"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.12.0",
    "mcp>=2.3.0",
    "ortools>=9.15.6755",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "jobshop"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets tests do `from tests.helpers import ...`.
pythonpath = ["."]
markers = ["slow: solves a full-size instance (a few seconds)"]
